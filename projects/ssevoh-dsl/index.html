<script type="application/json" id="project-data">{"slug":"ssevoh-dsl","name":"SSEVOH-DSL","theme":"Agents","description":"Operator-controlled contracts govern self-modification, bind approvals to their checked context, and block reuse of artifacts derived from withdrawn versions.","status":"Submitted · IEEE TSE","url":"https://github.com/ai4se4ai-lab/SSEVOH-DSL","tags":"Foundational Contracts · Harness evolution","research":true,"stage":"Submitted","stages":null,"team":["M. Babaei"],"links":[{"label":"Plain-language overview","url":"news/governing-agent-changes/","type":"paper"}],"publications":[{"status":"Submitted","venue":"IEEE TSE","title":"Governing Changes in Self-Evolving Agents.","authors":"M. Babaei.","paper":null,"preprint":null,"code":"https://github.com/ai4se4ai-lab/SSEVOH-DSL","abstract":{"kind":"Author-supplied abstract","text":"Self-evolving agents improve themselves by rewriting their own prompts, tools, memory, and workflows. Passing a test does not keep a change authorized as the harness continues to evolve: another change may alter a component that the approved one relies on, or an operator may withdraw a faulty version from which other tools, skills, or memories were derived. We present SSEVOH-DSL, a domain-specific language (DSL) and trusted enforcement service for Foundational Contracts: operator-controlled rules that govern self-modifications and the continued use of their results. An approval is bound to the state, policy, and validator evidence it checked. The service then rechecks freshness at commit, artifact identity and eligibility at execution, and recorded origins at reuse. Withdrawing a version therefore blocks everything derived from it, and rollback restores only versions that remain eligible. The service governs which changes take effect without altering how the agent proposes them. Bounded checks over 248,832 one-step cases and 19,620 explored transitions, and TLA+ model checking, found no disagreement with independent reference
