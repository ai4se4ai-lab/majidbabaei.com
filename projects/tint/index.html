<script type="application/json" id="project-data">{"slug":"tint","name":"TINT","theme":"Agents","description":"Contract-based specification and compositional verification of LLM guardrail hierarchies, with explicit evidence gates and checks for unsupported assumptions.","status":"Submitted · IEEE TSE","url":"https://github.com/ai4se4ai-lab/trust-is-not-transitive","tags":"AI × MDE · Guardrail composition","research":true,"stage":"Submitted","stages":null,"team":["M. Babaei"],"links":[],"publications":[{"status":"Submitted","venue":"IEEE TSE","title":"Trust Is Not Transitive: Verifying the Composition of LLM Guardrail Hierarchies.","authors":"M. Babaei.","paper":null,"preprint":null,"code":"https://github.com/ai4se4ai-lab/trust-is-not-transitive","abstract":{"kind":"Author-supplied abstract","text":"Large language model (LLM) agents increasingly rely on multiple guardrails to control their behavior, yet the safety of individual guardrails does not necessarily guarantee the safety of their composition. Existing approaches primarily evaluate guardrails independently, leaving uncertainty about whether their assumptions and guarantees remain valid when combined. To address this gap, we introduce a formal framework for specifying and verifying guardrail hierarchies through contract-based compositional reasoning. In this framework, evidence holds only for the stage invocation that produced it and moves forward only through explicit gates. Our approach determines whether a hierarchy satisfies its safety requirements, identifies unsupported assumptions, and supports risk certification and incremental reassessment following system changes. We prove the composition check sound, and complete relative to stages constrained only by their contracts, and we show that it is near-linear for hierarchies without fact propagation and coNP-complete in general. We evaluate the approach through mechanized proof checks, implementation conformance testing, scalability experiments, a structural analysis of public guardrail configurations, and an exploratory analysis of published designs. The proofs and conformance tests support the correctness of the verification procedure, the measurements confirm near-linear checking of large fact-free hierarchies, and the design analysis shows which assumptions their safety claims would need to support. Overall, our work provides a principled foundation for reasoning about the safety of composed LLM guardrails while making explicit the assumptions on which their guarantees depend."},"key":"babaei-trust-not-transitive","anonymous":false,"kind":"submitted","bibtex":"@unpublished{babaei-trust-not-transitive,\n  title = {Trust Is Not Transitive: Verifying the Composition of LLM Guardrail Hierarchies.},\n  author = {M. Babaei},\n  year = {2026},\n  note = {Submitted manuscript. Target venue: IEEE Transactions on Software Engineering. Submission and abstract supplied by the author, November 3, 2026.}\n}"}],"releases":[{"tag":"submitted-ieee-tse","date":"2026-11-03","type":"paper","title":"Submitted · IEEE TSE","notes":"**Trust Is Not Transitive: Verifying the Composition of LLM Guardrail Hierarchies.**\n\nM. Babaei.","links":[],"iso":"2026-11-03","label":"Nov 3, 2026","order":0},{"tag":"code-public","date":"2026-10-29","type":"code","title":"Code repository published","notes":"The research artifact is public on GitHub.","links":[{"label":"Repository","url":"https://github.com/ai4se4ai-lab/trust-is-not-transitive","type":"code"}],"iso":"2026-10-29","label":"Oct 29, 2026","order":1}],"gallery":[],"readme":"","updated":"Nov 3, 2026"}</script>
