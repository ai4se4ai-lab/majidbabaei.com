# ScholarPress configuration example. Copy outside the repository (for example to %LOCALAPPDATA%\ScholarPress\config.toml)
# and point SCHOLARPRESS_CONFIG at it. This file holds no credentials: git uses your existing credential manager or SSH agent.

# Private workspace: database, original sources, PDFs, build logs, staging releases. Must be OUTSIDE the site checkout.
data_dir = "C:/Users/you/AppData/Local/ScholarPress"
# The majidbabaei.com checkout (defaults to the folder that contains scholarpress/).
# site_dir = "C:/path/to/ai4se4ai-lab.github.io/majidbabaei.com"
# Maintained CV source, read only; used to report whether a CV handoff was applied (defaults to ../docs/02_Curriculum_Vitae.tex).
# cv_path = "C:/path/to/ai4se4ai-lab.github.io/docs/02_Curriculum_Vitae.tex"

host = "127.0.0.1"   # loopback only; other values are refused
port = 8765

# Compiler: "docker" (isolated; recommended for manuscripts you did not write), "local", or "auto".
compiler = "auto"
# Pin the TeX Live image by digest. Find it with:  docker pull texlive/texlive:latest && docker inspect --format '{{index .RepoDigests 0}}' texlive/texlive:latest
# docker_image = "texlive/texlive@sha256:<64 hex characters>"
docker_user = "1000:1000"
timeout_seconds = 180
memory = "2g"
cpus = "2"
pids_limit = 256
max_output_mb = 200
max_files = 200
max_file_mb = 50
max_total_mb = 200

# Publishing adapter: "staging" (local site release at http://127.0.0.1:<staging_port>/) or "production" (git push to Pages).
adapter = "staging"
staging_port = 8766
preview_port = 8767
production_remote = "origin"
production_branch = "main"
production_base_url = "https://majidbabaei.com"
verify_timeout_seconds = 900
verify_interval_seconds = 15
