  <title id="agenda-title">agenda.statechart</title>
  <desc id="agenda-desc">UML state machine with 3 states: Human (accountable · intent · concerns), Agentic AI (agents · teams · harness) and Quarantine (contained · kept in history; invariant: nothing exposed in use). Every run starts in Human. ① Delegate, from Human to Agentic AI: delegate [concerns modeled] / model; specify; compose; verify. ② Report, from Agentic AI to Human: report [contract holds] / trace; record; slice; explain. ③ Contain, from Agentic AI to Quarantine: report [contract violated] / withdraw closure; tries++. ④ Re-admit, from Quarantine to Agentic AI: [screen clean ∧ tries &lt; k] / re-admit. ⑤ Escalate, from Quarantine to Human: [else] / explain affected set. A note, the foundational contract, applies to every transition: bounded, attributable, traceable, correctable; assume, guarantee, evidence.</desc>
  <style>:root{--paper:#f6f3ec;--card:#fbf9f4;--ink:#14243a;--muted:#596273;--line:#dcd4c3;--navy:#19375f;--teal:#00737d;--orange:#b84f12;--rose:#b3263c;--serif:'Newsreader',Georgia,serif;--mono:'JetBrains Mono',Consolas,monospace}
