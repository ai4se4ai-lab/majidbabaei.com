<script type="application/json" id="project-data">{"slug":"morph-fl","name":"MORPH-FL","theme":"Analysis","description":"LLM-based fault localization for Python with separate observation, hypothesis, and dialogue models, enabling selective context resets that preserve recorded observations.","status":"Submitted · JSS","url":"https://github.com/ai4se4ai-lab/MORPH-FL","tags":"Fault localization · Context management","research":true,"stage":"Submitted","stages":null,"team":["M. Babaei"],"links":[],"publications":[{"status":"Submitted","venue":"JSS","title":"Does Forgetting Help? Studying Context Reset Policies in LLM Fault Localization.","authors":"M. Babaei. MORPH-FL.","paper":null,"preprint":null,"code":"https://github.com/ai4se4ai-lab/MORPH-FL","abstract":{"kind":"Author-supplied abstract","text":"Large language model (LLM) agents that localize faults from bug reports accumulate a dialogue in which checked facts, tentative explanations and the reasoning that links them are interleaved. When such an investigation stalls, a common remedy is to clear the context and start afresh, yet a reset that discards the dialogue can also discard what the agent has already established. We ask whether forgetting helps a localization agent, and what it should forget. We present MORPH-FL, a fault-localization framework for Python that keeps observations, hypotheses and dialogue in separate runtime models, so that a reset can clear dialogue and prune hypotheses while preserving every recorded observation. Using the framework as an experimental instrument, we compare four context policies on 50 SWE-bench issues from 12 repositories with two open 7B-scale code LLMs: adaptive reset on stagnation, continuous context, fixed-interval reset, and an observation-only view that shows the investigator its observations but neither its hypotheses nor its dialogue. Resetting the context, adaptively or on a schedule, did not change which issues were localized at rank one. The observation-only view localized more issues with one model and, with the other, kept grounded hypotheses on nearly every issue where the richer views kept almost none, at a higher time cost. Because rankings fall back to lexical retrieval when an investigation yields nothing, equal accuracy concealed very different investigations. The results suggest that what an agent is shown matters more than when its context is reset, and that context policies must be judged on investigation output and cost as well as accuracy."},"key":"babaei-morph-fl","kind":"submitted","bibtex":"@unpublished{babaei-morph-fl,\n  title = {Does Forgetting Help? Studying Context Reset Policies in LLM Fault Localization.},\n  author = {M. Babaei},\n  year = {2026},\n  note = {Submitted manuscript (MORPH-FL). Target venue: Journal of Systems and Software (JSS). Submission and abstract supplied by the author, October 29, 2026.}\n}"}],"releases":[{"tag":"submitted-jss","date":"2026-10-29","type":"paper","title":"Submitted · JSS","notes":"**Does Forgetting Help? Studying Context Reset Policies in LLM Fault Localization.**\n\nM. Babaei. MORPH-FL.","links":[],"iso":"2026-10-29","label":"Oct 29, 2026","order":0},{"tag":"code-public","date":"2026-10-19","type":"code","title":"Code repository published","notes":"The research artifact is public on GitHub.","links":[{"label":"Repository","url":"https://github.com/ai4se4ai-lab/MORPH-FL","type":"code"}],"iso":"2026-10-19","label":"Oct 19, 2026","order":1}],"gallery":[],"readme":"","updated":"Oct 29, 2026"}</script>
